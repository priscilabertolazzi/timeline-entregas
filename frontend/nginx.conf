# Servidor das telas: entrega os arquivos e repassa /api para a API, na mesma origem (ADR-21).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
  }

  # Qualquer outro endereço abre as telas (rotas do Angular).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
