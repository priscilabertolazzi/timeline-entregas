# Banco de dados, API e ferramentas de teste. As telas entram na tarefa T-09.
# Os valores vêm do arquivo .env (modelo em .env.example). Os padrões abaixo só evitam avisos
# nos comandos que não usam o banco, como test e lint.
name: timeline-entregas

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-timeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-timeline_entregas}
    ports:
      # Só o próprio computador alcança o banco.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - timeline-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Fuso horário: define a data atual da API (RN-19, arquitetura.md, seção 5.6).
      TZ: ${TZ:-America/Sao_Paulo}
      SEED_DADOS_EXEMPLO: ${SEED_DADOS_EXEMPLO:-true}
      # Dentro do Docker, o banco é o serviço "db", na porta padrão.
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-timeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-timeline_entregas}
    ports:
      # Só o próprio computador alcança a API.
      - "127.0.0.1:${API_PORT:-8080}:8080"

  web:
    build:
      context: frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # Só o próprio computador alcança as telas.
      - "127.0.0.1:${WEB_PORT:-4200}:80"

  # Container com o SDK do .NET, usado por install, test e lint (ADR-24, ADR-31).
  # Só roda quando chamado pelos scripts (perfil "ferramentas"), nunca com "docker compose up".
  ferramentas:
    profiles: ["ferramentas"]
    image: mcr.microsoft.com/dotnet/sdk:10.0
    entrypoint: ["sh", "/origem/scripts/ferramentas-container.sh"]
    environment:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    volumes:
      # O código entra somente para leitura; o container trabalha numa cópia.
      - ./backend:/origem/backend:ro
      - ./global.json:/origem/global.json:ro
      - ./.editorconfig:/origem/.editorconfig:ro
      - ./scripts/ferramentas-container.sh:/origem/scripts/ferramentas-container.sh:ro
      - timeline-nuget-cache:/root/.nuget/packages

  # Container com o Node.js, usado por install, test e lint do frontend (ADR-24, ADR-38).
  ferramentas-web:
    profiles: ["ferramentas"]
    image: node:24-slim
    entrypoint: ["sh", "/origem/scripts/ferramentas-web-container.sh"]
    environment:
      CI: "true"
      NG_CLI_ANALYTICS: "false"
    volumes:
      - ./frontend:/origem/frontend:ro
      - ./scripts/ferramentas-web-container.sh:/origem/scripts/ferramentas-web-container.sh:ro
      - timeline-npm-cache:/root/.npm

volumes:
  timeline-db-data:
  timeline-nuget-cache:
  timeline-npm-cache:
